<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline AI Assistant - Realtime Test</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;background:#0b1020;color:#f4f6fb}main{max-width:900px;margin:auto;padding:24px}.card{background:#151b2e;border:1px solid #28314c;border-radius:14px;padding:18px;margin-bottom:16px}button,select,input,textarea{font:inherit;padding:10px;border-radius:8px;border:1px solid #35405f;background:#0f1527;color:#fff}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.box{min-height:80px;background:#0f1527;border-radius:10px;padding:12px;white-space:pre-wrap}.muted{color:#9eabc9}.ok{color:#73e6a4}.err{color:#ff8998}.meter{font-variant-numeric:tabular-nums}
</style></head>
<body><main>
<h1>Offline AI Assistant</h1><p class="muted">Realtime Vosk STT + Piper TTS test page</p>
<section class="card"><h2>Server</h2><div id="status" class="box">Checking...</div></section>
<section class="card"><h2>Realtime STT</h2><div class="row"><button id="start">Start microphone</button><button id="stop" disabled>Stop</button><span id="sttState" class="muted">Idle</span></div><p>Speak English. Audio is converted to 16 kHz mono PCM in the browser and streamed to Vosk.</p><div id="final" class="box"></div><div id="partial" class="box muted"></div></section>
<section class="card"><h2>Piper TTS</h2><div class="row"><select id="voice"><option value="en_US-lessac-medium">en_US-lessac-medium</option></select><button id="speak">Speak</button></div><textarea id="text" rows="4" style="width:100%;margin-top:10px">Hello. This is the realtime Piper text to speech test.</textarea><div id="ttsState" class="muted" style="margin-top:10px">Idle</div></section>
<script>
const $=id=>document.getElementById(id);let ws=null,stream=null,ctx=null,source=null,processor=null;let finalText=[];let audioCtx=null,nextTime=0;
async function status(){try{const r=await fetch('/api/status');const j=await r.json();$('status').innerHTML='<span class="ok">'+JSON.stringify(j,null,2)+'</span>'}catch(e){$('status').innerHTML='<span class="err">'+e.message+'</span>'}}
status();
function downsample(buf,inRate,outRate){if(inRate===outRate)return buf;const ratio=inRate/outRate;const len=Math.round(buf.length/ratio);const out=new Float32Array(len);for(let i=0;i<len;i++){const idx=i*ratio|0;out[i]=buf[idx]||0}return out}
function floatToPCM16(f){const b=new ArrayBuffer(f.length*2),v=new DataView(b);for(let i=0;i<f.length;i++){let s=Math.max(-1,Math.min(1,f[i]));v.setInt16(i*2,s<0?s*0x8000:s*0x7fff,true)}return new Uint8Array(b)}
$('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});ctx=new AudioContext();await ctx.resume();source=ctx.createMediaStreamSource(stream);processor=ctx.createScriptProcessor(4096,1,1);ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/stt/stream');ws.binaryType='arraybuffer';ws.onopen=()=>{ws.send(JSON.stringify({type:'reset'}));$('sttState').textContent='Listening...';$('start').disabled=true;$('stop').disabled=false};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='partial')$('partial').textContent=m.text||'';if(m.type==='final'&&m.text){finalText.push(m.text);$('final').textContent=finalText.join(' ')}};ws.onerror=()=>$('sttState').textContent='WebSocket error';processor.onaudioprocess=e=>{if(ws&&ws.readyState===1){const pcm=downsample(e.inputBuffer.getChannelData(0),ctx.sampleRate,16000);ws.send(floatToPCM16(pcm))}};source.connect(processor);processor.connect(ctx.destination)}catch(e){$('sttState').textContent=e.message}}
$('stop').onclick=()=>{try{ws?.send(JSON.stringify({type:'finalize'}))}catch{};processor?.disconnect();source?.disconnect();stream?.getTracks().forEach(t=>t.stop());ctx?.close();ws?.close();$('sttState').textContent='Stopped';$('start').disabled=false;$('stop').disabled=true};
async function playPCM(bytes,sampleRate){audioCtx=audioCtx||new AudioContext();await audioCtx.resume();const samples=new Int16Array(bytes.buffer,bytes.byteOffset,Math.floor(bytes.byteLength/2));const buffer=audioCtx.createBuffer(1,samples.length,sampleRate);const ch=buffer.getChannelData(0);for(let i=0;i<samples.length;i++)ch[i]=samples[i]/32768;const node=audioCtx.createBufferSource();node.buffer=buffer;node.connect(audioCtx.destination);nextTime=Math.max(nextTime,audioCtx.currentTime);node.start(nextTime);nextTime+=buffer.duration}
$('speak').onclick=()=>{const t=$('text').value.trim(),voice=$('voice').value;if(!t)return;const s=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/tts/stream');s.binaryType='arraybuffer';let rate=22050;s.onmessage=e=>{if(typeof e.data==='string'){const m=JSON.parse(e.data);if(m.type==='audio_start'){rate=m.sample_rate;$('ttsState').textContent='Speaking...'}if(m.type==='audio_end')$('ttsState').textContent='Done';if(m.type==='error')$('ttsState').textContent=m.error}else playPCM(new Uint8Array(e.data),rate)};s.onopen=()=>s.send(JSON.stringify({type:'speak',text:t,voice}))};
</script></main></body></html>
